[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis"
version = "0.2.0"
description = "Deterministic procedural wallpaper engine driven by git-able recipes"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    # Floors are the versions golden digests were recorded against; ceilings
    # are the next potentially breaking majors. requirements.txt pins the
    # exact dev/golden environment on top of these.
    "numpy>=2.5,<3",
    "pillow>=11.3,<12",
]

[project.scripts]
genesis = "genesis.cli:main"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.setuptools.package-data]
genesis = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]
