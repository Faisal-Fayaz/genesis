# Continuous integration: lint plus the full test suite.
#
# Two jobs because the render-heavy files (golden digests, determinism,
# image quality, attractor forms) take an order of magnitude longer than
# everything else. Both install the exact pins from requirements.txt: the
# golden hashes are only valid against those builds (see
# tests/test_environment.py). The suite starts its own Xvfb where needed,
# so no display service is required.

name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-fast-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m ruff check genesis tests conftest.py
      - run: >
          xvfb-run -a python -m pytest
          --ignore=tests/test_image_quality.py
          --ignore=tests/test_golden.py
          --ignore=tests/test_determinism.py
          --ignore=tests/test_attractor_forms.py

  slow-render-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: >
          xvfb-run -a python -m pytest
          tests/test_image_quality.py
          tests/test_golden.py
          tests/test_determinism.py
          tests/test_attractor_forms.py
